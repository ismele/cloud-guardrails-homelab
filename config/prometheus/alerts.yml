groups:
  - name: web01
    rules:
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Memory above 80% for 10 minutes" }

      - alert: RootDiskFilling
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Root disk above 85%" }

      - alert: HighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "CPU above 85% for 5 minutes" }

      # Monitoring that silently stops is worse than no monitoring.
      - alert: ExporterDown
        expr: up{job="node"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "node_exporter is not reporting" }
